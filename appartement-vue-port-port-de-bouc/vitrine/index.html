<style>
  :root {
    --ivoire: #f4efe6;
    --anthracite: #302c29;
    --noir: #171615;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--noir); overflow: hidden; }

  .vitrine {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    color: var(--ivoire);
    text-decoration: none;
    font-family: var(--sans);
  }
  .vitrine img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .vitrine::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(23,22,21,.85) 0%, rgba(23,22,21,.35) 45%, rgba(23,22,21,0) 70%);
  }
  .vitrine:hover img { transform: scale(1.03); }

  .contenu {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(10px, 2.4vw, 22px);
    padding: clamp(14px, 4vw, 40px);
  }
  .titre {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(22px, 5vw, 48px);
    line-height: 1.05;
  }
  .lieu {
    display: block;
    margin-top: 6px;
    font-family: var(--sans);
    font-size: clamp(9px, 1.4vw, 12px);
    letter-spacing: .25em;
    text-transform: uppercase;
    opacity: .85;
  }
  .bouton {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: clamp(10px, 1.6vw, 15px) clamp(16px, 2.6vw, 28px);
    border-radius: 999px;
    background: var(--ivoire);
    color: var(--anthracite);
    max-width: 100%;
    font-size: clamp(10px, 1.4vw, 13px);
    line-height: 1.4;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(23,22,21,.35);
    transition: background .3s, transform .3s;
  }
  .vitrine:hover .bouton { background: #fff; transform: translateY(-2px); }
  .bouton svg { flex-shrink: 0; width: 1.1em; height: 1.1em; }
</style>
